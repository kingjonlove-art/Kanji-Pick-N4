<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT N4 Kanji Reading Quiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .setup-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    select, button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
    }

    select {
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-submit {
      background: var(--success);
      color: #052e16;
    }

    .btn-submit:hover {
      background: #16a34a;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Quiz Area */
    .hidden {
      display: none !important;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .kanji-box {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .kanji-char {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
    }

    .kanji-prompt {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--primary);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    @media (max-width: 520px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .kanji-char {
        font-size: 3.8rem;
      }
    }

    .option-btn {
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: var(--card-hover);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.18);
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--card);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-row button {
      flex: 1;
      min-width: 110px;
    }

    /* Result Screen */
    .result-summary {
      text-align: center;
      background: var(--bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .score-big {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 1rem;
    }

    .stat-correct { color: var(--success); font-weight: 700; }
    .stat-wrong { color: var(--danger); font-weight: 700; }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 20px;
    }

    .review-item {
      background: var(--bg);
      border-left: 5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .review-item.is-correct { border-left-color: var(--success); }
    .review-item.is-wrong { border-left-color: var(--danger); }

    .review-kanji {
      font-size: 2.1rem;
      font-weight: 700;
      min-width: 52px;
      text-align: center;
    }

    .review-details {
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .badge-ok { color: var(--success); font-weight: 700; }
    .badge-no { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>漢字 (Kanji) – N4 Reading Test</h1>
      <p>音読み (Katakana) &amp; 訓読み (Hiragana) Practice</p>
    </header>

    <!-- Setup Screen -->
    <div id="setup-screen" class="setup-box">
      <div class="control-group">
        <label for="question-count">প্রশ্নের সংখ্যা নির্বাচন করুন (Total 225 N4 Kanji):</label>
        <select id="question-count">
          <option value="10">10 Questions</option>
          <option value="20" selected>20 Questions</option>
          <option value="30">30 Questions</option>
          <option value="50">50 Questions</option>
          <option value="100">100 Questions</option>
          <option value="225">All 225 Kanji</option>
        </select>
      </div>

      <div class="control-group">
        <label for="reading-mode">Reading মোড নির্বাচন করুন:</label>
        <select id="reading-mode">
          <option value="mixed" selected>Mixed (音読み &amp; 訓読み)</option>
          <option value="on">Only 音読み (Katakana)</option>
          <option value="kun">Only 訓読み (Hiragana)</option>
        </select>
      </div>

      <button class="btn" id="start-btn">Start Test</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="status-row">
        <span id="question-counter">Question 1 / 20</span>
        <span id="answered-counter">Answered: 0 / 20</span>
      </div>

      <div class="kanji-box">
        <div class="kanji-char" id="kanji-display">住</div>
        <div class="kanji-prompt" id="reading-type-label">Reading নির্বাচন করুন</div>
      </div>

      <div class="options-grid" id="options-container"></div>

      <div class="nav-row">
        <button class="btn btn-secondary" id="prev-btn">Previous</button>
        <button class="btn" id="next-btn">Next</button>
        <button class="btn btn-submit" id="submit-btn">Submit Test</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <div class="result-summary">
        <div class="score-big" id="percentage-display">0%</div>
        <div id="score-text" style="margin-top: 6px; font-size: 1.1rem;">Score: 0 / 20</div>
        <div class="score-stats">
          <span class="stat-correct" id="correct-count">Correct: 0</span>
          <span class="stat-wrong" id="wrong-count">Wrong: 0</span>
        </div>
      </div>

      <div class="review-list" id="review-list"></div>

      <button class="btn" id="restart-btn" style="width: 100%;">Restart Test</button>
    </div>
  </div>

 let quizQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];

    const setupScreen = document.getElementById("setup-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    const questionCountSelect = document.getElementById("question-count");
    const readingModeSelect = document.getElementById("reading-mode");
    const startBtn = document.getElementById("start-btn");

    const progressBar = document.getElementById("progress-bar");
    const questionCounter = document.getElementById("question-counter");
    const answeredCounter = document.getElementById("answered-counter");
    const kanjiDisplay = document.getElementById("kanji-display");
    const readingTypeLabel = document.getElementById("reading-type-label");
    const optionsContainer = document.getElementById("options-container");

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");
    const restartBtn = document.getElementById("restart-btn");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildQuestions(count, mode) {
      let pool = [];

      if (mode === "on") {
        pool = KANJI_DATA.filter(item => item.on && item.on.trim() !== "");
      } else if (mode === "kun") {
        pool = KANJI_DATA.filter(item => item.kun && item.kun.trim() !== "");
      } else {
        pool = [...KANJI_DATA];
      }

      const selectedItems = shuffle(pool).slice(0, Math.min(count, pool.length));

      return selectedItems.map(item => {
        let targetType = mode;
        if (mode === "mixed") {
          if (item.on && item.kun) {
            targetType = Math.random() < 0.5 ? "on" : "kun";
          } else if (item.on) {
            targetType = "on";
          } else {
            targetType = "kun";
          }
        }

        const correctReading = targetType === "on" ? item.on : item.kun;
        const typeText = targetType === "on" ? "音読み (Katakana)" : "訓読み (Hiragana)";

        // একই ধরনের Reading থেকে ৩টি ভুল অপশন তৈরি করা (Katakana না থাকলে জোর করে বানানো হবে না)
        const distractorPool = KANJI_DATA
          .filter(other => other.k !== item.k && other[targetType] && other[targetType] !== correctReading)
          .map(other => other[targetType]);

        const uniqueDistractors = [...new Set(shuffle(distractorPool))].slice(0, 3);
        const options = shuffle([correctReading, ...uniqueDistractors]);

        return {
          kanji: item.k,
          typeText: typeText,
          correctAnswer: correctReading,
          options: options
        };
      });
    }

    function startQuiz() {
      const count = parseInt(questionCountSelect.value, 10);
      const mode = readingModeSelect.value;

      quizQuestions = buildQuestions(count, mode);
      currentIndex = 0;
      userAnswers = new Array(quizQuestions.length).fill(null);

      setupScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      const q = quizQuestions[currentIndex];
      const total = quizQuestions.length;

      kanjiDisplay.textContent = q.kanji;
      readingTypeLabel.textContent = `${q.typeText} নির্বাচন করুন`;

      questionCounter.textContent = `Question ${currentIndex + 1} / ${total}`;
      const answeredCount = userAnswers.filter(ans => ans !== null).length;
      answeredCounter.textContent = `Answered: ${answeredCount} / ${total}`;

      const progressPercent = ((currentIndex + 1) / total) * 100;
      progressBar.style.width = `${progressPercent}%`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === opt) {
          btn.classList.add("selected");
        }

        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
        btn.addEventListener("click", () => selectOption(opt));
        optionsContainer.appendChild(btn);
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === total - 1;
    }

    function selectOption(optionText) {
      userAnswers[currentIndex] = optionText;
      renderQuestion();
    }

    function showResults() {
      const total = quizQuestions.length;
      let correct = 0;
      let wrong = 0;

      const reviewList = document.getElementById("review-list");
      reviewList.innerHTML = "";

      quizQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correctAnswer;

        if (isCorrect) {
          correct++;
        } else {
          wrong++;
        }

        const itemDiv = document.createElement("div");
        itemDiv.className = `review-item ${isCorrect ? "is-correct" : "is-wrong"}`;

        itemDiv.innerHTML = `
          <div class="review-kanji">${q.kanji}</div>
          <div class="review-details">
            <div><strong>${idx + 1}. [${q.typeText}]</strong> — ${
              isCorrect
                ? '<span class="badge-ok">Correct ✔</span>'
                : '<span class="badge-no">Wrong ✘</span>'
            }</div>
            <div>Your Answer: <strong>${userAns ? userAns : "Not Answered"}</strong></div>
            <div>Correct Answer: <strong style="color: var(--primary);">${q.correctAnswer}</strong></div>
          </div>
        `;
        reviewList.appendChild(itemDiv);
      });

      const percentage = Math.round((correct / total) * 100);

      document.getElementById("percentage-display").textContent = `${percentage}%`;
      document.getElementById("score-text").textContent = `Score: ${correct} / ${total}`;
      document.getElementById("correct-count").textContent = `Correct: ${correct}`;
      document.getElementById("wrong-count").textContent = `Wrong: ${wrong}`;

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
    }

    startBtn.addEventListener("click", startQuiz);

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    });

    submitBtn.addEventListener("click", () => {
      const unanswered = userAnswers.filter(a => a === null).length;
      if (unanswered > 0) {
        const confirmSubmit = confirm(`এখনও ${unanswered}টি প্রশ্নের উত্তর দেওয়া হয়নি। তবুও কি Submit করতে চান?`);
        if (!confirmSubmit) return;
      }
      showResults();
    });

    restartBtn.addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    });
  </script>
