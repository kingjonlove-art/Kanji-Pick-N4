<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT Kanji Reading Quiz (Grouped)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .setup-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    select, button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
    }

    select {
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-submit {
      background: var(--success);
      color: #052e16;
    }

    .btn-submit:hover {
      background: #16a34a;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .kanji-box {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .kanji-char {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
    }

    .kanji-prompt {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--primary);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    @media (max-width: 520px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .kanji-char {
        font-size: 3.8rem;
      }
    }

    .option-btn {
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: var(--card-hover);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.18);
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--card);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-row button {
      flex: 1;
      min-width: 110px;
    }

    .result-summary {
      text-align: center;
      background: var(--bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .score-big {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 1rem;
    }

    .stat-correct { color: var(--success); font-weight: 700; }
    .stat-wrong { color: var(--danger); font-weight: 700; }

    .export-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .export-actions button {
      flex: 1;
      min-width: 140px;
    }

    .result-code-box {
      width: 100%;
      min-height: 130px;
      background: var(--bg);
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.82rem;
      margin-bottom: 18px;
      resize: vertical;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 20px;
    }

    .review-item {
      background: var(--bg);
      border-left: 5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .review-item.is-correct { border-left-color: var(--success); }
    .review-item.is-wrong { border-left-color: var(--danger); }

    .review-kanji {
      font-size: 2.1rem;
      font-weight: 700;
      min-width: 52px;
      text-align: center;
    }

    .review-details {
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .badge-ok { color: var(--success); font-weight: 700; }
    .badge-no { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>漢字 (Kanji) Reading Test (Grouped)</h1>
      <p>音読み (Katakana) &amp; 訓読み (Hiragana) Practice</p>
    </header>

    <div id="setup-screen" class="setup-box">
      <div class="control-group">
        <label for="range-select">Kanji রেঞ্জ নির্বাচন করুন (Group of 30):</label>
        <select id="range-select">
          <option value="1-30" selected>Range: 1 – 30 (30 Kanji)</option>
          <option value="31-60">Range: 31 – 60 (30 Kanji)</option>
          <option value="61-90">Range: 61 – 90 (30 Kanji)</option>
          <option value="91-120">Range: 91 – 120 (30 Kanji)</option>
          <option value="121-150">Range: 121 – 150 (30 Kanji)</option>
          <option value="151-180">Range: 151 – 180 (30 Kanji)</option>
          <option value="181-210">Range: 181 – 210 (30 Kanji)</option>
          <option value="211-240">Range: 211 – 240 (30 Kanji)</option>
          <option value="241-270">Range: 241 – 270 (30 Kanji)</option>
          <option value="271-300">Range: 271 – 300 (30 Kanji)</option>
          <option value="301-320">Range: 301 – 320 (20 Kanji)</option>
          <option value="all-320">All 320 Kanji</option>
        </select>
      </div>

      <div class="control-group">
        <label for="reading-mode">Reading মোড নির্বাচন করুন:</label>
        <select id="reading-mode">
          <option value="mixed" selected>Mixed (音読み &amp; 訓読み)</option>
          <option value="on">Only 音読み (Katakana)</option>
          <option value="kun">Only 訓読み (Hiragana)</option>
        </select>
      </div>

      <button class="btn" id="start-btn" type="button">Start Test</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="status-row">
        <span id="question-counter">Question 1 / 30</span>
        <span id="answered-counter">Answered: 0 / 30</span>
      </div>

      <div class="kanji-box">
        <div class="kanji-char" id="kanji-display">人</div>
        <div class="kanji-prompt" id="reading-type-label">Reading নির্বাচন করুন</div>
      </div>

      <div class="options-grid" id="options-container"></div>

      <div class="nav-row">
        <button class="btn btn-secondary" id="prev-btn" type="button">Previous</button>
        <button class="btn" id="next-btn" type="button">Next</button>
        <button class="btn btn-submit" id="submit-btn" type="button">Submit Test</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div class="result-summary">
        <div class="score-big" id="percentage-display">0%</div>
        <div id="score-text" style="margin-top: 6px; font-size: 1.1rem;">Score: 0 / 30</div>
        <div class="score-stats">
          <span class="stat-correct" id="correct-count">Correct: 0</span>
          <span class="stat-wrong" id="wrong-count">Wrong: 0</span>
        </div>
      </div>

      <div class="export-actions">
        <button class="btn btn-secondary" id="copy-result-btn" type="button">Copy Result Code</button>
        <button class="btn" id="download-result-btn" type="button">Download Result (.txt)</button>
      </div>

      <textarea id="result-code-output" class="result-code-box" readonly></textarea>

      <div class="review-list" id="review-list"></div>

      <button class="btn" id="restart-btn" type="button" style="width: 100%;">Restart Test</button>
    </div>
  </div>

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildQuestions(rangeValue, mode) {
      let pool = [];

      if (rangeValue === "all-320") {
        pool = [...KANJI_DATA];
      } else {
        const parts = rangeValue.split("-");
        const startId = parseInt(parts[0], 10);
        const endId = parseInt(parts[1], 10);
        pool = KANJI_DATA.filter(item => item.id >= startId && item.id <= endId);
      }

      if (mode === "on") {
        pool = pool.filter(item => item.on && item.on.trim() !== "");
      } else if (mode === "kun") {
        pool = pool.filter(item => item.kun && item.kun.trim() !== "");
      } else {
        pool = pool.filter(item => (item.on && item.on.trim() !== "") || (item.kun && item.kun.trim() !== ""));
      }

      const selectedItems = shuffle(pool);

      return selectedItems.map(item => {
        let targetType = mode;
        if (mode === "mixed") {
          const hasOn = item.on && item.on.trim() !== "";
          const hasKun = item.kun && item.kun.trim() !== "";
          if (hasOn && hasKun) {
            targetType = Math.random() < 0.5 ? "on" : "kun";
          } else if (hasOn) {
            targetType = "on";
          } else {
            targetType = "kun";
          }
        }

        const correctReading = targetType === "on" ? item.on : item.kun;
        const typeText = targetType === "on" ? "音読み (Katakana)" : "訓読み (Hiragana)";

        const distractorPool = KANJI_DATA
          .filter(other => other.k !== item.k && other[targetType] && other[targetType].trim() !== "" && other[targetType] !== correctReading)
          .map(other => other[targetType]);

        const uniqueDistractors = [...new Set(shuffle(distractorPool))].slice(0, 3);
        const options = shuffle([correctReading, ...uniqueDistractors]);

        return {
          kanji: item.k,
          typeText: typeText,
          correctAnswer: correctReading,
          options: options
        };
      });
    }

    function startQuiz() {
      const rangeVal = rangeSelect.value;
      const mode = readingModeSelect.value;

      quizQuestions = buildQuestions(rangeVal, mode);
      currentIndex = 0;
      userAnswers = new Array(quizQuestions.length).fill(null);
      latestResultPayload = "";

      document.getElementById("review-list").innerHTML = "";
      resultCodeOutput.value = "";
      setupScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      if (!quizQuestions.length) return;
      const q = quizQuestions[currentIndex];
      const total = quizQuestions.length;

      kanjiDisplay.textContent = q.kanji;
      readingTypeLabel.textContent = `${q.typeText} নির্বাচন করুন`;

      questionCounter.textContent = `Question ${currentIndex + 1} / ${total}`;
      const answeredCount = userAnswers.filter(ans => ans !== null).length;
      answeredCounter.textContent = `Answered: ${answeredCount} / ${total}`;

      const progressPercent = ((currentIndex + 1) / total) * 100;
      progressBar.style.width = `${progressPercent}%`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === opt) {
          btn.classList.add("selected");
        }

        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
        btn.addEventListener("click", () => selectOption(opt));
        optionsContainer.appendChild(btn);
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === total - 1;
    }

    function selectOption(optionText) {
      userAnswers[currentIndex] = optionText;
      renderQuestion();
    }

    function generateResultCode(scoreData) {
      const payloadObj = {
        exam: "JLPT Kanji Reading Test (Grouped)",
        submittedAt: new Date().toISOString(),
        totalQuestions: scoreData.total,
        correct: scoreData.correct,
        wrong: scoreData.wrong,
        percentage: scoreData.percentage,
        answers: scoreData.details
      };
      return JSON.stringify(payloadObj, null, 2);
    }

    function showResults() {
      const total = quizQuestions.length;
      let correct = 0;
      let wrong = 0;
      const details = [];

      const reviewList = document.getElementById("review-list");
      reviewList.innerHTML = "";

      quizQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correctAnswer;

        if (isCorrect) {
          correct++;
        } else {
          wrong++;
        }

        details.push({
          no: idx + 1,
          kanji: q.kanji,
          type: q.typeText,
          yourAnswer: userAns || "Not Answered",
          correctAnswer: q.correctAnswer,
          status: isCorrect ? "Correct" : "Wrong"
        });

        const itemDiv = document.createElement("div");
        itemDiv.className = `review-item ${isCorrect ? "is-correct" : "is-wrong"}`;

        itemDiv.innerHTML = `
          <div class="review-kanji">${q.kanji}</div>
          <div class="review-details">
            <div><strong>${idx + 1}. [${q.typeText}]</strong> — ${
              isCorrect
                ? '<span class="badge-ok">Correct ✔</span>'
                : '<span class="badge-no">Wrong ✘</span>'
            }</div>
            <div>Your Answer: <strong>${userAns ? userAns : "Not Answered"}</strong></div>
            <div>Correct Answer: <strong style="color: var(--primary);">${q.correctAnswer}</strong></div>
          </div>
        `;
        reviewList.appendChild(itemDiv);
      });

      const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

      document.getElementById("percentage-display").textContent = `${percentage}%`;
      document.getElementById("score-text").textContent = `Score: ${correct} / ${total}`;
      document.getElementById("correct-count").textContent = `Correct: ${correct}`;
      document.getElementById("wrong-count").textContent = `Wrong: ${wrong}`;

      latestResultPayload = generateResultCode({
        total,
        correct,
        wrong,
        percentage,
        details
      });
      resultCodeOutput.value = latestResultPayload;

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
    }

        navigator.clipboard.writeText(latestResultPayload).then(() => {
          copyResultBtn.textContent = "Copied ✔";
          setTimeout(() => {
            copyResultBtn.textContent = "Copy Result Code";
          }, 1800);
        }).catch(() => fallbackCopyText(latestResultPayload));
      } else {
        fallbackCopyText(latestResultPayload);
      }
    });

    downloadResultBtn.addEventListener("click", () => {
      if (!latestResultPayload) return;
      const blob = new Blob([latestResultPayload], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `kanji-group-result-${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    startBtn.addEventListener("click", startQuiz);

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    });

    submitBtn.addEventListener("click", () => {
      const unanswered = userAnswers.filter(a => a === null).length;
      if (unanswered > 0) {
        const confirmSubmit = confirm(`এখনও ${unanswered}টি প্রশ্নের উত্তর দেওয়া হয়নি। তবুও কি Submit করতে চান?`);
        if (!confirmSubmit) return;
      }
      showResults();
    });

    restartBtn.addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    });
  </script>
</body>
</html>
